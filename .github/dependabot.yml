# Dependabot Configuration
# This file configures regular version updates for your project.
# NOTE: Security updates (vulnerabilities and leaks) are automatically triggered
# by GitHub as soon as a threat is discovered, regardless of the schedule below!

version: 2
updates:
  # 1. Keep NPM packages (JavaScript/Node) updated
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Checks for non-security updates once a week
      interval: "weekly"
    # Limits the number of open automated Pull Requests to avoid clutter
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "dependabot"
      - "security" # Helps categorize updates related to stability

  # 2. Keep GitHub Actions workflows updated
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
