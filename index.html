<!doctype html>
<!-- 
  Root HTML Document
  This is the entry point that the browser loads first.
  It sets up the Progressive Web App (PWA) meta tags, making the app installable 
  on mobile devices and behave like a native app.
-->
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Standard Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- 
      Viewport Configuration
      Crucial for mobile and PWA. It disables zooming (user-scalable=no) 
      and ensures the app takes exactly the screen width, acting like a native app.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Links to the PWA Manifest generated by Vite (defines icons, app name, etc.) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- 
      iOS Specific PWA Meta Tags 
      Apple devices require these specific tags to launch the web app 
      without Safari's top URL bar and bottom navigation.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Event Prize Wheel" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- 
      Android / General PWA Meta Tags 
      Allows Chrome on Android to install it to the home screen.
      'theme-color' matches the deep blue background so the system status bar blends in.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a192f" />

    <!-- App Title displayed on browser tabs -->
    <title>Event Prize Wheel</title>
  </head>
  <body>
    <!-- 
      React Mount Point 
      React will inject the entire application inside this div.
    -->
    <div id="root"></div>
    
    <!-- 
      Main Entry Script 
      Vite injects React and our application logic through this ES module.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
